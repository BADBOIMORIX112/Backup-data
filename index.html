<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BackupData — Stay Connected</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --bg: #061410;
      --bg2: #0b211a;
      --card: rgba(255,255,255,0.08);
      --card-border: rgba(255,255,255,0.12);
      --green: #20e889;
      --green2: #11b86b;
      --text: #ffffff;
      --muted: #a9bbb5;
      --danger: #ff6b6b;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(32,232,137,.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0,180,120,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 85px;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       SPLASH SCREEN
    ========================== */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background:
        radial-gradient(circle at center, rgba(32,232,137,.18), transparent 38%),
        linear-gradient(145deg, #03100c, #0a261d);
      animation: splashFade 1s ease forwards;
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      font-weight: 900;
      color: white;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.28),
        rgba(255,255,255,.05)
      );
      border: 1px solid rgba(255,255,255,.28);
      box-shadow:
        0 25px 70px rgba(32,232,137,.22),
        inset 0 1px 1px rgba(255,255,255,.4);
      backdrop-filter: blur(20px);
    }

    .splash-title {
      margin-top: 22px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .splash-title span {
      color: var(--green);
    }

    .splash-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .loader {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--green);
      margin-top: 28px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes splashFade {
      0%, 80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* =========================
       APP HEADER
    ========================== */

    .topbar {
      max-width: 600px;
      margin: auto;
      padding: 22px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .brand span {
      color: var(--green);
    }

    .account-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: white;
      font-size: 20px;
      backdrop-filter: blur(15px);
    }

    /* =========================
       MAIN
    ========================== */

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 0 18px;
    }

    .screen {
      display: none;
      animation: pageIn .25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       HOME HERO
    ========================== */

    .hero {
      margin-top: 15px;
      padding: 28px 22px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg,
          rgba(32,232,137,.18),
          rgba(255,255,255,.055)
        );
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 60px rgba(0,0,0,.25);
      backdrop-filter: blur(20px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -80px;
      top: -80px;
      background: rgba(32,232,137,.12);
      filter: blur(5px);
    }

    .hello {
      color: var(--green);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -1.2px;
      max-width: 430px;
    }

    .hero p {
      color: var(--muted);
      margin-top: 13px;
      line-height: 1.5;
      font-size: 15px;
      max-width: 470px;
    }

    .primary-btn {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      color: #03100c;
      background: linear-gradient(135deg, #4dffab, #14d77c);
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 12px 30px rgba(32,232,137,.18);
    }

    .primary-btn:active {
      transform: scale(.98);
    }

    /* =========================
       LIVE ACTIVITY
    ========================== */

    .activity {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      flex-shrink: 0;
    }

    .activity-text {
      font-size: 13px;
      color: #d9e5e1;
    }

    .activity-text strong {
      color: white;
    }

    /* =========================
       SECTION
    ========================== */

    .section {
      margin-top: 27px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-head h2 {
      font-size: 19px;
    }

    .section-head span {
      color: var(--green);
      font-size: 12px;
      font-weight: bold;
    }

    /* =========================
       SERVICES
    ========================== */

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      border: 1px solid var(--card-border);
      background: var(--card);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: left;
      backdrop-filter: blur(15px);
    }

    .service-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(32,232,137,.12);
      font-size: 22px;
      margin-bottom: 14px;
    }

    .service h3 {
      font-size: 15px;
    }

    .service p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .service.disabled {
      opacity: .58;
    }

    .soon {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 9px;
      background: rgba(255,255,255,.08);
      color: #c6d1cd;
    }

    /* =========================
       POPULAR PLANS
    ========================== */

    .plans {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .plan {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 17px;
    }

    .plan small {
      color: var(--muted);
      font-size: 11px;
    }

    .plan h3 {
      font-size: 22px;
      margin-top: 5px;
    }

    .plan-price {
      color: var(--green);
      font-weight: 900;
      margin-top: 5px;
    }

    .plan button {
      width: 100%;
      border: 0;
      margin-top: 13px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(32,232,137,.13);
      color: var(--green);
      font-weight: bold;
    }

    /* =========================
       WHY US
    ========================== */

    .why {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .why-item {
      padding: 15px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
    }

    .why-item b {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .why-item span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

        <!-- =========================
         BUY DATA
    ========================== -->

    <section id="buy" class="screen">

      <h1 class="page-title">Buy Data 📱</h1>

      <p class="page-subtitle">
        Choose your network and data plan.
      </p>

      <div class="form-card">

        <label>Network</label>

        <div class="network-tabs">

          <button
            class="network-tab active"
            id="network-MTN"
            onclick="changeNetwork('MTN')">
            MTN
          </button>

          <button
            class="network-tab"
            id="network-Airtel"
            onclick="changeNetwork('Airtel')">
            Airtel
          </button>

          <button
            class="network-tab"
            id="network-Glo"
            onclick="changeNetwork('Glo')">
            Glo
          </button>

          <button
            class="network-tab"
            id="network-9mobile"
            onclick="changeNetwork('9mobile')">
            9mobile
          </button>

        </div>

        <div id="offersTitle" class="offers-title">
          MTN Data Plans
        </div>

        <div id="offerCount" class="offer-count">
          Available plans
        </div>

        <div id="dataPlanGrid" class="data-plan-grid"></div>

        <div id="selectedSummary" class="selected-summary">

          <div>
            <span>Selected</span>
            <strong id="summaryData">No plan</strong>
          </div>

          <div>
            <span>Network</span>
            <strong id="summaryNetwork">-</strong>
          </div>

          <div>
            <span>Price</span>
            <strong id="summaryPrice">₦0</strong>
          </div>

        </div>

        <label for="phone">Phone Number</label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          placeholder="08012345678"
          maxlength="11"
        >

        <button
          class="primary-btn"
          onclick="placeOrder()">
          Continue
        </button>

        <button
          class="back-btn"
          onclick="showScreen('home')">
          ← Back Home
        </button>

        <div
          id="orderMessage"
          class="message">
        </div>

        <div class="form-note">
          This is currently a demo. Real payment and
          automatic data delivery will be connected later.
        </div>

      </div>

    </section>
    
    /* =========================
       DATA PLAN SELECTOR
    ========================== */

    .network-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .network-tab {
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.05);
      color: var(--muted);
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .network-tab.active {
      background: rgba(32,232,137,.15);
      border-color: var(--green);
      color: var(--green);
    }

    .offers-title {
      margin-top: 20px;
      font-size: 17px;
      font-weight: 900;
    }

    .offer-count {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .data-plan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    .data-plan {
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.045);
      border-radius: 15px;
      padding: 14px;
      text-align: left;
    }

    .data-plan.selected {
      border-color: var(--green);
      background: rgba(32,232,137,.12);
    }

    .data-plan-data {
      font-size: 18px;
      font-weight: 900;
    }

    .data-plan-price {
      color: var(--green);
      font-weight: 900;
      margin-top: 5px;
    }

    .data-plan-validity {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    .selected-summary {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      padding: 13px;
      border-radius: 14px;
      background: rgba(32,232,137,.08);
      border: 1px solid rgba(32,232,137,.18);
    }

    .selected-summary span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      margin-bottom: 4px;
    }

    .selected-summary strong {
      font-size: 12px;
    }

    @media (max-width: 390px) {
      .network-tab {
        font-size: 10px;
      }

      .data-plan-grid {
        grid-template-columns: 1fr;
      }
                       }
    /* =========================
       ACCOUNT
    ========================== */

    .account-card {
      margin-top: 20px;
      padding: 22px;
      border-radius: 22px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--card-border);
    }

    .account-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(32,232,137,.13);
      font-size: 30px;
    }

    .account-card h2 {
      text-align: center;
      margin-top: 14px;
    }

    .account-card p {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .account-option {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.05);
      color: white;
      text-align: left;
    }

    /* =========================
       THEMES
    ========================== */

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .theme {
      min-height: 105px;
      padding: 15px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.06);
    }

    .theme-preview {
      height: 40px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .theme-name {
      font-weight: bold;
      font-size: 13px;
    }

    .theme-status {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    /* =========================
       BACKUP AI
    ========================== */

    #aiBubble {
      position: fixed;
      right: 18px;
      bottom: 88px;
      z-index: 9000;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      background: linear-gradient(145deg, #1ee88b, #0a8f57);
      color: white;
      font-size: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      cursor: grab;
      touch-action: none;
    }

    #aiBubble:active {
      cursor: grabbing;
    }

    #aiChat {
      display: none;
      position: fixed;
      z-index: 8999;
      right: 16px;
      bottom: 155px;
      width: min(350px, calc(100vw - 32px));
      border-radius: 22px;
      overflow: hidden;
      background: #0c1e18;
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .ai-header {
      padding: 16px;
      background: linear-gradient(135deg, #153d2e, #0a251c);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-header strong {
      font-size: 15px;
    }

    .ai-close {
      border: 0;
      background: transparent;
      color: white;
      font-size: 20px;
    }

    .ai-body {
      padding: 16px;
    }

    .ai-message {
      background: rgba(255,255,255,.07);
      padding: 12px;
      border-radius: 13px;
      color: #dbe7e2;
      font-size: 13px;
      line-height: 1.5;
    }

    .ai-input {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .ai-input input {
      flex: 1;
    }

    .ai-input button {
      width: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: #03100c;
      font-weight: bold;
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: fixed;
      z-index: 8000;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(5,19,15,.9);
      border-top: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #81958e;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .nav-btn span {
      font-size: 20px;
    }

    .nav-btn.active {
      color: var(--green);
    }

    /* =========================
       SUPPORT
    ========================== */

    .support {
      text-align: center;
      margin-top: 30px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .support a {
      color: var(--green);
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #60736d;
      font-size: 10px;
      margin-top: 25px;
    }

    @media (max-width: 390px) {
      .hero h1 {
        font-size: 28px;
      }

      .services,
      .why,
      .plans,
      .theme-grid {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SPLASH
  ========================== -->

  <div id="splash">
    <div class="splash-logo">BD</div>
    <div class="splash-title">BACKUP<span>DATA</span></div>
    <div class="splash-subtitle">Fast • Affordable • Reliable</div>
    <div class="loader"></div>
  </div>

  <!-- =========================
       HEADER
  ========================== -->

  <div class="topbar">
    <div class="brand">BACKUP<span>DATA</span></div>

    <button class="account-btn" onclick="showScreen('account')">
      👤
    </button>
  </div>

  <main class="container">

    <!-- =========================
         HOME
    ========================== -->

    <section id="home" class="screen active">

      <div class="hero">

        <div class="hello">WELCOME TO BACKUPDATA 👋</div>

        <h1>Stay connected without stress.</h1>

        <p>
          Get affordable mobile data quickly and easily.
          Simple buying. Great prices. More services coming.
        </p>

        <button class="primary-btn" onclick="showScreen('buy')">
          📱 BUY DATA NOW
        </button>

      </div>

      <div class="activity">
        <div class="live-dot"></div>

        <div class="activity-text" id="activityText">
          <strong>BackupData is ready.</strong>
          More live activity will appear when real orders begin.
        </div>
      </div>

      <!-- SERVICES -->

      <div class="section">
