<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BackupData - Buy Data Easily</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      color: #d1d5db;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .plans {
      margin-top: 15px;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
      text-align: center;
    }

    .support {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #555;
    }

    .support a {
      color: #16a34a;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>BackupData</h1>
  <p>Buy mobile data quickly and easily</p>
</header>

<div class="container">

  <div class="card">

    <h2>Buy Data</h2>

    <label for="network">Select Network</label>

    <select id="network">
      <option value="MTN">MTN</option>
      <option value="Airtel">Airtel</option>
      <option value="Glo">Glo</option>
      <option value="9mobile">9mobile</option>
    </select>

    <label for="plan">Select Data Plan</label>

    <select id="plan">
      <option value="500MB">500MB - ₦500</option>
      <option value="1GB">1GB - ₦800</option>
      <option value="2GB">2GB - ₦1,500</option>
      <option value="5GB">5GB - ₦2,500</option>
      <option value="10GB">10GB - ₦4,500</option>
    </select>

    <label for="phone">Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="08012345678"
      maxlength="11"
    >

    <button onclick="buyData()">Buy Data</button>

    <div class="message" id="message"></div>

  </div>

  <div class="support">
    Need help?<br>
    WhatsApp: 
    <a href="https://wa.me/2347084912007">
      07084912007
    </a>
  </div>

</div>

<script>
  function buyData() {

    const network = document.getElementById("network").value;
    const plan = document.getElementById("plan").value;
    const phone = document.getElementById("phone").value;
    const message = document.getElementById("message");

    if (phone.length !== 11 || !phone.startsWith("0")) {
      message.style.display = "block";
      message.innerHTML = "Please enter a valid 11-digit Nigerian phone number.";
      return;
    }

    message.style.display = "block";

    message.innerHTML =
      "Demo order received!<br><br>" +
      "Network: " + network + "<br>" +
      "Plan: " + plan + "<br>" +
      "Phone: " + phone + "<br><br>" +
      "Payment and automatic data delivery will be connected later.";
  }
</script>

</body>
  </html>
