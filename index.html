<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BackupData — Stay Connected</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --bg: #061410;
      --bg2: #0b211a;
      --card: rgba(255,255,255,.065);
      --card-border: rgba(255,255,255,.12);
      --green: #20e889;
      --green2: #11b86b;
      --text: #ffffff;
      --muted: #a9bbb5;
      --danger: #ff6b6b;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(32,232,137,.16), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0,180,120,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 85px;
    }

    body.light-mode {
      --bg: #f4f8f6;
      --bg2: #ffffff;
      --card: rgba(0,0,0,.045);
      --card-border: rgba(0,0,0,.10);
      --text: #10221c;
      --muted: #66756f;
      background:
        radial-gradient(circle at top right, rgba(32,232,137,.13), transparent 35%),
        #f4f8f6;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* SPLASH */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background:
        radial-gradient(circle at center, rgba(32,232,137,.18), transparent 38%),
        linear-gradient(145deg, #03100c, #0a261d);
      animation: splashFade 1s ease forwards;
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      font-weight: 900;
      color: white;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.28),
        rgba(255,255,255,.05)
      );
      border: 1px solid rgba(255,255,255,.28);
      box-shadow:
        0 25px 70px rgba(32,232,137,.22),
        inset 0 1px 1px rgba(255,255,255,.4);
      backdrop-filter: blur(20px);
    }

    .splash-title {
      margin-top: 22px;
      font-size: 34px;
      font-weight: 900;
    }

    .splash-title span {
      color: var(--green);
    }

    .splash-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .loader {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--green);
      margin-top: 28px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splashFade {
      0%,80% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* HEADER */

    .topbar {
      max-width: 600px;
      margin: auto;
      padding: 22px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .brand span {
      color: var(--green);
    }

    .account-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      font-size: 20px;
      backdrop-filter: blur(15px);
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 0 18px;
    }

    .screen {
      display: none;
      animation: pageIn .25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HOME */

    .hero {
      margin-top: 15px;
      padding: 28px 22px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          rgba(32,232,137,.18),
          rgba(255,255,255,.055)
        );
      border: 1px solid var(--card-border);
      box-shadow: 0 25px 60px rgba(0,0,0,.25);
      backdrop-filter: blur(20px);
    }

    .hello {
      color: var(--green);
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 32px;
      line-height: 1.05;
      letter-spacing: -1.2px;
    }

    .hero p {
      color: var(--muted);
      margin-top: 13px;
      line-height: 1.5;
      font-size: 15px;
    }

    .primary-btn {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      color: #03100c;
      background: linear-gradient(135deg,#4dffab,#14d77c);
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 12px 30px rgba(32,232,137,.18);
    }

    .primary-btn:active {
      transform: scale(.98);
    }

    .activity {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      flex-shrink: 0;
    }

    .activity-text {
      font-size: 13px;
      color: var(--muted);
    }

    .activity-text strong {
      color: var(--text);
    }

    .section {
      margin-top: 27px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-head h2 {
      font-size: 19px;
    }

    .section-head span {
      color: var(--green);
      font-size: 11px;
      font-weight: bold;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      border: 1px solid var(--card-border);
      background: var(--card);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: left;
      backdrop-filter: blur(15px);
    }

    .service-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(32,232,137,.12);
      font-size: 22px;
      margin-bottom: 14px;
    }

    .service h3 {
      font-size: 15px;
    }

    .service p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .service.disabled {
      opacity: .58;
    }

    .soon {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 7px;
      border-radius: 7px;
      font-size: 9px;
      background: rgba(255,255,255,.08);
      color: var(--muted);
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 11px;
    }

    .plan {
      background: rgba(255,255,255,.06);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 17px;
    }

    .plan small {
      color: var(--muted);
      font-size: 11px;
    }

    .plan h3 {
      font-size: 22px;
      margin-top: 5px;
    }

    .plan-price {
      color: var(--green);
      font-weight: 900;
      margin-top: 5px;
    }

    .plan button {
      width: 100%;
      border: 0;
      margin-top: 13px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(32,232,137,.13);
      color: var(--green);
      font-weight: bold;
    }

    .why {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .why-item {
      padding: 15px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--card-border);
    }

    .why-item b {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .why-item span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    /* PAGE */

    .page-title {
      margin-top: 20px;
      font-size: 27px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 7px;
      line-height: 1.5;
    }

    /* BUY DATA */

    .buy-top {
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--card-border);
    }

    .buy-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .network-tabs {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 6px;
    }

    .network-tab {
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 11px 5px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .network-tab.active {
      color: #03100c;
      background: var(--green);
      border-color: var(--green);
    }

    .offers-title {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .offers-title h2 {
      font-size: 18px;
    }

    .offers-title span {
      color: var(--muted);
      font-size: 10px;
    }

    /* FLAT DATA CARDS */

    .data-plan-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 7px;
      margin-top: 11px;
    }

    .data-plan-card {
      position: relative;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(255,255,255,.045);
      padding: 12px 5px;
      text-align: center;
      min-height: 108px;
      color: var(--text);
      transition: .18s;
    }

    .data-plan-card:active {
      transform: scale(.97);
    }

    .data-plan-card.selected {
      border-color: var(--green);
      background: rgba(32,232,137,.12);
      box-shadow: 0 0 0 1px var(--green);
    }

    .data-plan-card.selected::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 10px;
      color: var(--green);
      font-weight: 900;
    }

    .data-plan-price {
      font-size: 15px;
      font-weight: 900;
      color: var(--green);
    }

    .data-plan-amount {
      font-size: 14px;
      font-weight: 800;
      margin-top: 8px;
    }

    .data-plan-validity {
      color: var(--muted);
      font-size: 9px;
      margin-top: 6px;
      line-height: 1.2;
    }

    .data-plan-badge {
      display: inline-block;
      margin-top: 7px;
      font-size: 8px;
      padding: 3px 5px;
      border-radius: 4px;
      background: rgba(32,232,137,.10);
      color: var(--green);
      font-weight: bold;
    }

    .selected-summary {
      display: none;
      margin-top: 17px;
      padding: 14px;
      border: 1px solid rgba(32,232,137,.25);
      background: rgba(32,232,137,.08);
      border-radius: 10px;
    }

    .selected-summary.show {
      display: block;
    }

    .summary-title {
      color: var(--green);
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .summary-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .summary-main strong {
      font-size: 16px;
    }

    .summary-price {
      color: var(--green);
      font-weight: 900;
    }

    .summary-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .phone-box {
      margin-top: 17px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--card-border);
    }

    .phone-box label {
      display: block;
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--green);
    }

    select option {
      background: #10231d;
      color: white;
    }

    .buy-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(32,232,137,.12);
      border: 1px solid rgba(32,232,137,.2);
      color: #baffda;
      font-size: 12px;
      line-height: 1.6;
    }

    .message.error {
      background: rgba(255,107,107,.1);
      border-color: rgba(255,107,107,.2);
      color: #ffc2c2;
    }

    .back-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 10px;
      font-weight: bold;
    }

    /* ACCOUNT */

    .account-card {
      margin-top: 20px;
      padding: 22px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(15px);
    }

    .account-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(32,232,137,.13);
      font-size: 30px;
    }

    .account-card h2 {
      text-align: center;
      margin-top: 14px;
    }

    .account-card p {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .account-option {
      margin-top: 11px;
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      text-align: left;
    }

    .form-title {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .form-description {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 15px;
      text-align: left !important;
    }

    .field {
      margin-top: 13px;
    }

    .field label {
      display: block;
      margin: 0 0 7px;
      font-size: 12px;
      font-weight: bold;
      color: var(--text);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 7px;
      height: 40px;
      padding: 0 9px;
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 11px;
      font-weight: bold;
    }

    .switch-text {
      text-align: center !important;
      margin-top: 14px !important;
      color: var(--muted);
      font-size: 12px !important;
    }

    .switch-text button {
      border: 0;
      background: transparent;
      color: var(--green);
      font-weight: bold;
    }

    .profile-head {
      text-align: center;
    }

    .profile-avatar {
      width: 78px;
      height: 78px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg,#4dffab,#0ca964);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #03100c;
      font-size: 30px;
      font-weight: 900;
    }

    .profile-name {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 900;
    }

    .profile-status {
      display: inline-block;
      margin-top: 7px;
      padding: 5px 8px;
      border-radius: 7px;
      background: rgba(32,232,137,.12);
      color: var(--green);
      font-size: 10px;
      font-weight: bold;
    }

    .profile-info {
      margin-top: 20px;
      border-top: 1px solid var(--card-border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 12px;
    }

    .info-row span:first-child {
      color: var(--muted);
    }

    .info-row span:last-child {
      text-align: right;
      word-break: break-word;
    }

    .settings-panel {
      display: none;
    }

    .settings-panel.show {
      display: block;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-title {
      font-size: 13px;
      font-weight: bold;
    }

    .setting-description {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
      line-height: 1.4;
    }

    .toggle {
      width: 46px;
      height: 25px;
      border-radius: 20px;
      border: 0;
      background: #50605b;
      position: relative;
      flex-shrink: 0;
    }

    .toggle::after {
      content: "";
      width: 19px;
      height: 19px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 4px;
      transition: .2s;
    }

    .toggle.on {
      background: var(--green);
    }

    .toggle.on::after {
      left: 23px;
    }

    .danger-btn {
      color: #ff8d8d !important;
    }

    .panel-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 13px;
      text-align: left !important;
    }

    /* THEMES */

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .theme {
      min-height: 105px;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid var(--card-border);
      background: var(--card);
    }

    .theme-preview {
      height: 40px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .theme-name {
      font-weight: bold;
      font-size: 13px;
    }

    .theme-status {
      color: var(--muted);
      font-size: 10px;
      margin-top: 5px;
    }

    /* AI */

    #aiBubble {
      position: fixed;
      right: 18px;
      bottom: 88px;
      z-index: 9000;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      background: linear-gradient(145deg,#1ee88b,#0a8f57);
      color: white;
      font-size: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.35);
      cursor: grab;
      touch-action: none;
    }

    #aiChat {
      display: none;
      position: fixed;
      z-index: 8999;
      right: 16px;
      bottom: 155px;
      width: min(350px,calc(100vw - 32px));
      border-radius: 20px;
      overflow: hidden;
      background: #0c1e18;
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .ai-header {
      padding: 16px;
      background: linear-gradient(135deg,#153d2e,#0a251c);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-close {
      border: 0;
      background: transparent;
      color: white;
      font-size: 20px;
    }

    .ai-body {
      padding: 16px;
    }

    .ai-message {
      background: rgba(255,255,255,.07);
      padding: 12px;
      border-radius: 13px;
      color: #dbe7e2;
      font-size: 13px;
      line-height: 1.5;
    }

    .ai-input {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .ai-input input {
      flex: 1;
    }

    .ai-input button {
      width: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--green);
      color: #03100c;
      font-weight: bold;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      z-index: 8000;
      bottom: 0;
      left: 0;
      right: 0;
      heigh
